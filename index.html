<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>우리 아이의 예술 성향 검사</title>
<style>
body {
  font-family: "Apple SD Gothic Neo", sans-serif;
  background:#f5f3ef;
  padding:40px;
}
h1 { font-size:24px; }
.question { margin-bottom:30px; }
button {
  display:block;
  margin:8px 0;
  padding:10px;
  width:100%;
  border:none;
  background:#ddd;
  cursor:pointer;
}
button:hover { background:#bbb; }
#result {
  display:none;
  background:#fff;
  padding:30px;
  margin-top:40px;
}
.small {
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<h1>아이의 그림 성향을 알아보세요</h1>

<div id="quiz"></div>

<div id="result"></div>

<script>
// ----------------------
// 화가 타입 정의
// ----------------------
const artists = {
  klee: {
    name: "파울 클레형",
    desc: "생각을 정리한 뒤 기호와 구조로 표현하는 아이",
    rare: "이 성향은 7–9세에서 비교적 드뭅니다."
  },
  miro: {
    name: "호안 미로형",
    desc: "자유로운 상징과 색으로 먼저 말하는 아이",
    rare: "이 성향은 이 시기에 유지되기 드문 편입니다."
  },
  picasso: {
    name: "피카소형",
    desc: "사물을 해체하고 다시 구성하려는 사고를 가진 아이",
    rare: "이 시기에 나타나면 사고 전환이 빠른 편입니다."
  },
  matisse: {
    name: "마티스형",
    desc: "정확함보다 느낌과 색을 먼저 잡는 아이",
    rare: "초등 초반에 점차 줄어드는 성향입니다."
  }
};

// ----------------------
// 질문 데이터
// ----------------------
const questions = [
  {
    q: "아이는 그림을 그리기 전, 한참을 바라보는 편인가요?",
    a: [
      { text: "그렇다", score:{klee:3, picasso:2} },
      { text: "중간", score:{matisse:2} },
      { text: "아니다", score:{miro:3} }
    ]
  },
  {
    q: "완성보다 과정에 더 몰입하나요?",
    a: [
      { text: "그렇다", score:{miro:3, matisse:2} },
      { text: "중간", score:{picasso:2} },
      { text: "아니다", score:{klee:3} }
    ]
  },
  {
    q: "그림을 설명해 달라 하면 말보다 손짓이 많은가요?",
    a: [
      { text: "그렇다", score:{miro:3} },
      { text: "중간", score:{matisse:2} },
      { text: "아니다", score:{klee:3, picasso:2} }
    ]
  }
  // 필요하면 여기서 질문 계속 추가
];

// ----------------------
// 상태값
// ----------------------
let current = 0;
let scores = { klee:0, miro:0, picasso:0, matisse:0 };

// ----------------------
// 렌더링
// ----------------------
const quizDiv = document.getElementById("quiz");

function renderQuestion() {
  if (current >= questions.length) {
    showResult();
    return;
  }

  const q = questions[current];
  quizDiv.innerHTML = `
    <div class="question">
      <h3>${q.q}</h3>
      ${q.a.map((opt,i)=>`
        <button onclick="answer(${i})">${opt.text}</button>
      `).join("")}
    </div>
  `;
}

function answer(i) {
  const chosen = questions[current].a[i].score;
  for (let key in chosen) {
    scores[key] += chosen[key];
  }
  current++;
  renderQuestion();
}

function showResult() {
  quizDiv.style.display="none";

  let top = Object.keys(scores).reduce((a,b)=>
    scores[a] > scores[b] ? a : b
  );

  const r = artists[top];

  document.getElementById("result").innerHTML = `
    <h2>${r.name}</h2>
    <p>${r.desc}</p>
    <p class="small">${r.rare}</p>
    <hr>
    <p class="small">
      이 성향은 환경에 따라 전혀 다른 방향으로 발전할 수 있습니다.<br>
      지금의 경험이 중요한 시기입니다.
    </p>
  `;
  document.getElementById("result").style.display="block";
}

renderQuestion();
</script>

</body>
</html>
