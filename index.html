<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>우리 아이의 예술 성향 검사</title>
<link rel="stylesheet" href="./style.css">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background:#f5f3ef;
    padding:28px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  .small { color:#666; font-size: 13px; line-height: 1.5; }
  .card {
    background:#fff;
    border-radius:14px;
    padding:18px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
    margin-top:14px;
  }
  .progress { font-size: 12px; color:#666; margin-bottom:8px; }
  .q { font-size: 18px; margin-bottom:12px; line-height:1.4; }
  .btn {
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#e7e3db;
    cursor:pointer;
    font-size:15px;
    margin:8px 0;
  }
  .btn:hover { background:#d9d4cb; }
  .hidden { display:none; }
  .result-img {
    width:100%;
    border-radius:12px;
    margin:12px 0;
  }
  .pill {
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    background:#f3f0ea;
    font-size:12px;
    color:#555;
  }
</style>
</head>

<body>
<div class="wrap">
  <h1>아이의 그림 성향을 알아보세요</h1>
  <div class="small">10문항 · 부모 관찰형 · 결과는 예술가 유형으로 제시됩니다.</div>

  <div id="quiz" class="card">
    <div id="progress" class="progress"></div>
    <div id="question" class="q"></div>

    <button class="btn" data-choice="yes">그렇다</button>
    <button class="btn" data-choice="mid">중간</button>
    <button class="btn" data-choice="no">아니다</button>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<script src="./script.js" defer></script>
</body>
</html>
