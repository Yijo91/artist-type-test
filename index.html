<script>
const params = new URLSearchParams(location.search);
const DEBUG = params.get("debug") === "1";
const SEED  = (params.get("seed") || "").toUpperCase();

const artists = {
  klee: {
    name: "파울 클레형",
    desc: "생각을 정리한 뒤 기호와 구조로 표현하는 아이",
    rare: "이 성향은 7–9세에서 비교적 드뭅니다.",
    tip: "‘정답’보다 ‘구조’에 관심이 큽니다. 과정 설명을 허용하면 표현이 확 열립니다."
  },
  miro: {
    name: "호안 미로형",
    desc: "자유로운 상징과 색으로 먼저 말하는 아이",
    rare: "이 성향은 이 시기에 유지되기 드문 편입니다.",
    tip: "설명 강요보다 ‘그림이 말하게’ 두면 좋습니다. 억압하면 급격히 작아질 수 있습니다."
  },
  picasso: {
    name: "피카소형",
    desc: "사물을 해체하고 다시 구성하려는 사고를 가진 아이",
    rare: "이 시기에 나타나면 사고 전환이 빠른 편입니다.",
    tip: "‘다른 시점’ 제시가 효과적입니다. 변형 과제가 잘 맞습니다."
  },
  matisse: {
    name: "마티스형",
    desc: "정확함보다 느낌과 색을 먼저 잡는 아이",
    rare: "초등 초반에 점차 줄어드는 성향입니다.",
    tip: "색 선택을 존중하면 자신감이 자랍니다. 정교함은 나중에 따라오게 해도 됩니다."
  }
};

const questions = [
  {
    q: "아이는 그림을 그리기 전, 한참을 바라보는 편인가요?",
    a: [
      { text:"그렇다", score:{klee:3, picasso:2} },
      { text:"중간",   score:{klee:1, matisse:1, picasso:1, miro:1} },
      { text:"아니다", score:{miro:3, matisse:2} }
    ]
  },
  {
    q: "완성보다 과정(그리고 있는 중)에 더 몰입하나요?",
    a: [
      { text:"그렇다", score:{miro:3, matisse:2} },
      { text:"중간",   score:{miro:1, picasso:2} },
      { text:"아니다", score:{klee:3, picasso:1} }
    ]
  },
  {
    q: "그림을 설명해 달라 하면 말보다 ‘보여주기’가 많은가요?",
    a: [
      { text:"그렇다", score:{miro:3, matisse:2} },
      { text:"중간",   score:{miro:1, picasso:1, matisse:1} },
      { text:"아니다", score:{klee:3, picasso:2} }
    ]
  },
  {
    q: "한 장을 그릴 때, 자주 지우고 다시 그리나요?",
    a: [
      { text:"그렇다", score:{klee:3, picasso:2} },
      { text:"중간",   score:{klee:1, picasso:1, matisse:1} },
      { text:"아니다", score:{miro:2, matisse:3} }
    ]
  },
  {
    q: "사물을 ‘있는 그대로’보다 ‘다르게’ 그리려는 편인가요?",
    a: [
      { text:"그렇다", score:{picasso:3, miro:2} },
      { text:"중간",   score:{picasso:2, matisse:1} },
      { text:"아니다", score:{klee:2, matisse:2} }
    ]
  },
  {
    q: "색을 고를 때 이유가 ‘느낌’에 가까운가요?",
    a: [
      { text:"그렇다", score:{matisse:3, miro:2} },
      { text:"중간",   score:{matisse:2, klee:1} },
      { text:"아니다", score:{klee:2, picasso:2} }
    ]
  },
  {
    q: "같은 주제라도 ‘다른 버전’을 여러 개 만들고 싶어하나요?",
    a: [
      { text:"그렇다", score:{picasso:3, klee:2} },
      { text:"중간",   score:{picasso:2, miro:1} },
      { text:"아니다", score:{matisse:2, miro:2} }
    ]
  },
  {
    q: "규칙/방법을 알려주면 더 편안해하나요?",
    a: [
      { text:"그렇다", score:{klee:3, picasso:2} },
      { text:"중간",   score:{klee:2, matisse:1} },
      { text:"아니다", score:{miro:3, matisse:2} }
    ]
  },
  {
    q: "그림 속에 기호(표시, 문자, 반복되는 모양)를 자주 넣나요?",
    a: [
      { text:"그렇다", score:{klee:3, miro:2} },
      { text:"중간",   score:{klee:2, picasso:1} },
      { text:"아니다", score:{matisse:2, picasso:2} }
    ]
  },
  {
    q: "선(윤곽, 형태)을 먼저 잡아야 안심하는 편인가요?",
    a: [
      { text:"그렇다", score:{klee:3, picasso:2} },
      { text:"중간",   score:{picasso:2, matisse:1} },
      { text:"아니다", score:{matisse:3, miro:2} }
    ]
  },
];

let current = 0;
let scores = { klee:0, miro:0, picasso:0, matisse:0 };
let answers = [];

const quizDiv = document.getElementById("quiz");
const resultDiv = document.getElementById("result");
const debugBox = document.getElementById("debug");

function showError(err){
  quizDiv.innerHTML = `
    <div style="color:#b00020; font-weight:700;">스크립트 오류로 문항을 표시하지 못했습니다.</div>
    <div class="small" style="margin-top:8px;">${String(err).replaceAll("<","&lt;").replaceAll(">","&gt;")}</div>
    <div class="small" style="margin-top:12px;">주소 뒤에 <b>?debug=1</b>을 붙이면 점수/진행 상태도 확인됩니다.</div>
  `;
}

function renderQuestion() {
  const total = questions.length;
  if (current >= total) return showResult();

  const q = questions[current];
  quizDiv.innerHTML = `
    <div class="progress">${current+1} / ${total}</div>
    <div class="q">${q.q}</div>
    ${q.a.map((opt,i)=>`<button class="btn" onclick="answer(${i})">${opt.text}</button>`).join("")}
    <div class="row">
      <button class="btn ghost" onclick="resetQuiz()">처음으로</button>
      <button class="btn ghost" onclick="backOne()" ${current===0 ? "disabled" : ""}>이전</button>
    </div>
    <div class="small" style="margin-top:10px;">※ 부모님 관찰 기준으로 가장 가까운 선택을 고르시면 됩니다.</div>
  `;
  if (DEBUG) showDebug(false);
}

function applyScore(delta, dir=1) {
  for (const k of Object.keys(scores)) scores[k] += (delta[k] || 0) * dir;
}

function answer(i) {
  const chosen = questions[current].a[i];
  answers[current] = i;
  applyScore(chosen.score, +1);
  current++;
  if (SEED) autoSeedStep();
  else renderQuestion();
}

function backOne() {
  if (current === 0) return;
  current--;
  const prevIdx = answers[current];
  if (prevIdx !== undefined) {
    const prev = questions[current].a[prevIdx];
    applyScore(prev.score, -1);
    answers[current] = undefined;
  }
  renderQuestion();
}

function resetQuiz() {
  current = 0;
  scores = { klee:0, miro:0, picasso:0, matisse:0 };
  answers = [];
  quizDiv.style.display = "block";
  resultDiv.style.display = "none";
  renderQuestion();
}

function breakTies(topKeys) {
  const priority = ["klee","picasso","matisse","miro"];
  for (const p of priority) if (topKeys.includes(p)) return p;
  return topKeys[0];
}

function showResult() {
  quizDiv.style.display = "none";
  const maxScore = Math.max(...Object.values(scores));
  const topKeys = Object.keys(scores).filter(k => scores[k] === maxScore);
  const top = topKeys.length === 1 ? topKeys[0] : breakTies(topKeys);
  const r = artists[top];

  resultDiv.innerHTML = `
    <div class="pill">결과</div>
    <h2 class="result-title">${r.name}</h2>
    <p style="margin:8px 0 0; line-height:1.6;">${r.desc}</p>
    <p class="small" style="margin:10px 0 0;">${r.rare}</p>
    <div class="hr"></div>
    <div class="small"><b>이 아이에게 잘 맞는 자극</b><br>${r.tip}</div>
    <div class="hr"></div>
    <div class="small">
      이 성향은 나이가 들수록 사라지거나, 환경에 따라 전혀 다른 방향으로 발전할 수 있습니다.<br>
      <b>지금의 경험이 방향을 만듭니다.</b>
    </div>
    <div class="row">
      <button class="btn" onclick="resetQuiz()">다시 하기</button>
      <button class="btn" onclick="copyResult()">결과 복사</button>
    </div>
  `;
  resultDiv.style.display = "block";
  if (DEBUG) showDebug(true);
}

function copyResult() {
  const maxScore = Math.max(...Object.values(scores));
  const topKeys = Object.keys(scores).filter(k => scores[k] === maxScore);
  const top = topKeys.length === 1 ? topKeys[0] : breakTies(topKeys);
  const r = artists[top];

  const text =
`${r.name}
${r.desc}
${r.rare}
(한 줄) 지금의 경험이 방향을 만듭니다.`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>alert("결과 문구를 복사했습니다."));
  } else {
    // 구형 환경 대비
    prompt("아래 내용을 복사하십시오.", text);
  }
}

function showDebug(isResult=false) {
  debugBox.style.display = "block";
  const rows = Object.entries(scores).map(([k,v]) => `${k.padEnd(7)} : ${v}`).join("\n");
  debugBox.textContent = (isResult ? "[DEBUG: RESULT]\n" : "[DEBUG]\n") + rows + "\n\n답변기록: " + JSON.stringify(answers);
}

function bestOptionForSeed(seedKey, q) {
  let bestI = 0, bestGain = -Infinity;
  q.a.forEach((opt, i) => {
    const gain = (opt.score[seedKey] || 0);
    if (gain > bestGain) { bestGain = gain; bestI = i; }
  });
  return bestI;
}

function autoSeedStep() {
  if (current >= questions.length) return showResult();
  const seedKey = SEED.toLowerCase();
  if (!artists[seedKey]) return renderQuestion();
  const q = questions[current];
  const i = bestOptionForSeed(seedKey, q);
  const chosen = q.a[i];
  answers[current] = i;
  applyScore(chosen.score, +1);
  current++;
  autoSeedStep();
}

/* ✅ 전역 등록(이게 핵심) */
window.answer = answer;
window.backOne = backOne;
window.resetQuiz = resetQuiz;
window.copyResult = copyResult;

/* 시작 */
try {
  if (SEED) autoSeedStep();
  else renderQuestion();
} catch (err) {
  showError(err);
}
</script>
